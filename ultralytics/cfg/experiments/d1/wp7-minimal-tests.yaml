# D1 WP7 engineering acceptance contract. Runtime paths are supplied by the CLI.
schema_version: d1-wp7-v1
seed: 0
deterministic: true

common:
  imgsz: 640
  workers: 0
  amp: true
  optimizer: AdamW
  lr0: 0.001
